<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Robot Face" />
  <title>Robot Face</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="face" aria-label="Robot face">
      <div class="eyes">
        <div class="eye"><div class="pupil" id="p1"></div></div>
        <div class="eye"><div class="pupil" id="p2"></div></div>
      </div>
      <div class="mouth" id="mouth"></div>
    </section>

    <section class="hud hidden" id="hud" aria-label="Controls">
      <div class="row">
        <button class="btn" data-mood="neutral">Neutral</button>
        <button class="btn" data-mood="smile">Smile</button>
        <button class="btn" data-mood="surprise">Surprise</button>
      </div>

      <div class="row">
        <label class="label" for="lineColor">Line Color</label>
        <input id="lineColor" type="color" value="#00ff00" />
        <button class="btn" id="fullBtn">Fullscreen</button>
      </div>

      <div class="row">
        <button class="btn" id="sensorBtn">Enable Sensors</button>
        <label class="label"><input type="radio" name="mode" id="modeMotion" checked /> Motion</label>
        <label class="label"><input type="radio" name="mode" id="modeTilt" /> Tilt</label>
      </div>

      <div class="row">
        <label class="label" for="gain">Motion Gain</label>
        <input id="gain" type="range" min="3" max="80" value="18" />
        <span class="mono" id="gainVal">18</span>
      </div>

      <div class="row">
        <label class="label" for="smooth">Smoothness</label>
        <input id="smooth" type="range" min="0" max="90" value="55" />
        <span class="mono" id="smoothVal">55</span>
      </div>

      <div class="row">
        <label class="label" for="range">Eye Range</label>
        <input id="range" type="range" min="24" max="70" value="54" />
        <span class="mono" id="rangeVal">54</span>
      </div>

      <div class="row">
        <label class="label"><input type="checkbox" id="debug" /> Debug</label>
        <span class="mono" id="dbg"></span>
      </div>

      <div class="tip">
        Tap the background to show/hide this UI.<br/>
        Tips: Motion can feel “snappy” on iPad. Increase Smoothness to slow it down.
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
