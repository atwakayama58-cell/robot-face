<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Robot Face" />
  <title>Robot Face</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="face" aria-label="Robot face">
      <div class="eyes">
        <div class="eye"><div class="pupil" id="p1"></div></div>
        <div class="eye"><div class="pupil" id="p2"></div></div>
      </div>
      <div class="mouth" id="mouth"></div>
    </section>

    <!-- HUD: hidden by default -->
    <section class="hud hidden" id="hud" aria-label="Controls">
      <div class="row">
        <button class="btn" data-mood="neutral">Neutral</button>
        <button class="btn" data-mood="smile">Smile</button>
        <button class="btn" data-mood="surprise">Surprise</button>
      </div>

      <div class="row">
        <label class="label" for="lineColor">Line Color</label>
        <input id="lineColor" type="color" value="#00ff00" />
        <button class="btn" id="fullBtn">Fullscreen</button>
      </div>

      <div class="row">
        <button class="btn" id="orientBtn">Enable Tilt</button>
        <label class="label"><input type="checkbox" id="tiltMode" checked /> Eyes follow tilt</label>
      </div>

      <div class="tip">
        Tap the background to show/hide this UI.<br/>
        Tip: For true fullscreen on iPad, use Safari → Share → Add to Home Screen.
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
