<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Robot Face" />
  <title>Robot Face</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="screen" aria-label="Robot face">
      <div class="scanlines"></div>
      <div class="glow"></div>

      <div class="eyes" aria-label="Eyes">
        <div class="eye" aria-label="Left eye">
          <div class="eye-shine"></div>
          <div class="pupil" id="p1"></div>
        </div>
        <div class="eye" aria-label="Right eye">
          <div class="eye-shine"></div>
          <div class="pupil" id="p2"></div>
        </div>
      </div>

      <div class="mouth" id="mouth" aria-label="Mouth"></div>
    </section>

    <section class="hud hidden" id="hud" aria-label="Controls">
      <div class="row">
        <button class="btn" data-mood="smile">Smile</button>
        <button class="btn" data-mood="neutral">Neutral</button>
        <button class="btn" data-mood="off">No Mouth</button>
        <button class="btn" id="fullBtn">Fullscreen</button>
      </div>

      <div class="row">
        <label class="label" for="accent">Accent</label>
        <input id="accent" type="color" value="#1aa7ff" />
        <label class="label" for="pupilColor">Pupil</label>
        <input id="pupilColor" type="color" value="#2fe3ff" />
      </div>

      <div class="row">
        <button class="btn" id="sensorBtn">Enable Sensors</button>
        <label class="label"><input type="radio" name="mode" id="modeMotion" checked /> Motion</label>
        <label class="label"><input type="radio" name="mode" id="modeTilt" /> Tilt</label>
      </div>

      <div class="row">
        <label class="label" for="gain">Motion Gain</label>
        <input id="gain" type="range" min="3" max="90" value="22" />
        <span class="mono" id="gainVal">22</span>
      </div>

      <div class="row">
        <label class="label" for="smooth">Smoothness</label>
        <input id="smooth" type="range" min="0" max="90" value="72" />
        <span class="mono" id="smoothVal">72</span>
      </div>

      <div class="row">
        <label class="label" for="range">Eye Range</label>
        <input id="range" type="range" min="12" max="110" value="82" />
        <span class="mono" id="rangeVal">82</span>
      </div>

      <div class="row">
        <label class="label">Landscape Mapping</label>
        <select id="landscapeMap" class="select">
          <option value="auto" selected>Auto</option>
          <option value="swap">Swap X/Y</option>
          <option value="swap-invert-x">Swap + invert X</option>
          <option value="swap-invert-y">Swap + invert Y</option>
          <option value="invert-x">Invert X</option>
          <option value="invert-y">Invert Y</option>
        </select>
        <span class="mono" id="ori"></span>
      </div>

      <div class="row">
        <label class="label"><input type="checkbox" id="debug" /> Debug</label>
        <span class="mono" id="dbg"></span>
      </div>

      <div class="tip">
        Tap the background to show/hide this UI.<br/>
        Eyes are big; pupils move inside each eye (direction is easy to see).
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
